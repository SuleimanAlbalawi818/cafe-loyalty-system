<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة الولاء - SHABTEN CARD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }

        .loader-box {
            background: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #ddd;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card-wrapper {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .loyalty-card {
            background: linear-gradient(135deg, #222222, #111111);
            color: #fff;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
            text-align: right;
            margin-bottom: 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .store-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .store-logo {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.85);
            background: #fff;
        }

        .store-name {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .brand-badge {
            font-size: 10px;
            background: rgba(255,255,255,0.18);
            padding: 4px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* صندوق النقاط وشريط التقدم والأختام */
        .points-box {
            background: rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 18px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .points-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 2px;
        }

        .points-value {
            font-size: 34px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* شريط التقدم البصري */
        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.35);
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ffae00);
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }

        /* شبكة الأختام التفاعلية */
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 14px 0 10px 0;
            justify-items: center;
        }

        .stamp-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: rgba(255,255,255,0.4);
            transition: all 0.35s ease;
        }

        .stamp-circle.active {
            background: #fff;
            border: 2px solid #ffd700;
            color: #111;
            transform: scale(1.06);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .motivation-text {
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.25);
            color: #fff;
        }

        .motivation-ready {
            background: rgba(40, 167, 69, 0.85);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
        }

        .cust-label {
            font-size: 11px;
            opacity: 0.75;
        }

        .cust-val {
            font-weight: bold;
            font-size: 15px;
            margin-top: 2px;
        }

        .wallet-btn {
            width: 100%;
            padding: 15px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: 0.3s;
        }
        .wallet-btn:hover { opacity: 0.9; }
        .wallet-btn:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="loadingBox" class="loader-box">
        <div class="spinner"></div>
        <div id="loadingText">جاري تجهيز بطاقتك...</div>
    </div>

    <div id="cardWrapper" class="card-wrapper hidden">
        <div id="loyaltyCard" class="loyalty-card">
            <div class="card-header">
                <div class="store-info">
                    <img id="cardLogo" class="store-logo hidden" src="" alt="Logo">
                    <div>
                        <div id="cardStoreName" class="store-name">بطاقة الولاء</div>
                        <div id="rewardHint" style="font-size:11px; opacity:0.85;">مكافأة مجانية عند 10 نقاط</div>
                    </div>
                </div>
                <span class="brand-badge">SHABTEN CARD</span>
            </div>

            <div class="points-box">
                <div class="points-label">رصيد النقاط الحالي</div>
                <div id="cardPoints" class="points-value">0</div>

                <!-- شريط التقدم -->
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>

                <!-- شبكة الأختام التفاعلية -->
                <div id="stampsGrid" class="stamps-grid"></div>

                <!-- الرسالة التحفيزية -->
                <div id="motivationText" class="motivation-text">اجمع النقاط للحصول على مكافأتك!</div>
            </div>

            <div class="card-footer">
                <div>
                    <div class="cust-label">اسم حامل البطاقة</div>
                    <div id="cardCustName" class="cust-val">-</div>
                </div>
                <div style="text-align: left;">
                    <div class="cust-label">رقم البطاقة</div>
                    <div id="cardIdDisplay" class="cust-val" dir="ltr">-</div>
                </div>
            </div>
        </div>

        <button id="googleWalletBtn" class="wallet-btn">
            📲 إضافة البطاقة إلى Google Wallet
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA6BpW0hlP6EUycPPkrk6pR-3Z0FRawWwc",
          authDomain: "cafe-system-24331.firebaseapp.com",
          projectId: "cafe-system-24331",
          storageBucket: "cafe-system-24331.firebasestorage.app",
          messagingSenderId: "845856227747",
          appId: "1:845856227747:web:378c6d02fc89410df41a16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cardId = (urlParams.get('id') || '').trim().toUpperCase();
        let cafeId = (urlParams.get('cafe') || '').trim().toLowerCase();

        const loadingBox = document.getElementById('loadingBox');
        const loadingText = document.getElementById('loadingText');
        const cardWrapper = document.getElementById('cardWrapper');
        const loyaltyCard = document.getElementById('loyaltyCard');
        const cardLogo = document.getElementById('cardLogo');
        const cardStoreName = document.getElementById('cardStoreName');
        const rewardHint = document.getElementById('rewardHint');
        const cardPoints = document.getElementById('cardPoints');
        const progressFill = document.getElementById('progressFill');
        const stampsGrid = document.getElementById('stampsGrid');
        const motivationText = document.getElementById('motivationText');
        const cardCustName = document.getElementById('cardCustName');
        const cardIdDisplay = document.getElementById('cardIdDisplay');
        const googleWalletBtn = document.getElementById('googleWalletBtn');

        let customerDataGlobal = null;
        let cafeDataGlobal = {};
        let targetPoints = 10;
        let rewardTitleText = "كوب قهوة مجاني ☕";
        let stampIcon = "☕";

        // دالة لتحديث شريط التقدم والأختام التفاعلية والرسالة التحفيزية
        function updateStampsAndProgress(currentPts) {
            cardPoints.innerText = currentPts;

            // حساب النسبة المئوية لشريط التقدم (بحد أقصى 100%)
            const percentage = Math.min(100, Math.round((currentPts / targetPoints) * 100));
            progressFill.style.width = `${percentage}%`;

            // رسم الأختام (بحد أقصى 15 ختماً للحفاظ على جمالية التصميم)
            const stampsCount = Math.min(targetPoints, 15);
            stampsGrid.innerHTML = "";
            for (let i = 1; i <= stampsCount; i++) {
                const circle = document.createElement('div');
                const isStamped = currentPts >= i;
                circle.className = `stamp-circle ${isStamped ? 'active' : ''}`;
                circle.innerText = isStamped ? stampIcon : i;
                stampsGrid.appendChild(circle);
            }

            // تحديث الرسالة التحفيزية
            if (currentPts >= targetPoints) {
                const rewardsCount = Math.floor(currentPts / targetPoints);
                motivationText.className = "motivation-text motivation-ready";
                motivationText.innerText = `🎉 مبروك! لديك (${rewardsCount}) مكافأة جاهزة للاستبدال (${rewardTitleText})!`;
            } else {
                const remaining = targetPoints - currentPts;
                motivationText.className = "motivation-text";
                motivationText.innerText = `باقي لك ${remaining} نقاط فقط للحصول على ${rewardTitleText}`;
            }
        }

        async function initCardPage() {
            if (!cardId) {
                loadingText.innerText = "❌ رقم البطاقة غير موجود في الرابط!";
                return;
            }

            try {
                const custRef = doc(db, "customers", cardId);
                const custSnap = await getDoc(custRef);

                if (!custSnap.exists()) {
                    loadingText.innerText = "❌ لم يتم العثور على هذه البطاقة!";
                    return;
                }

                customerDataGlobal = custSnap.data();

                if (!cafeId && customerDataGlobal.cafeId) {
                    cafeId = customerDataGlobal.cafeId.toLowerCase();
                }

                if (cafeId) {
                    const cafeSnap = await getDoc(doc(db, "cafes", cafeId));
                    if (cafeSnap.exists()) {
                        cafeDataGlobal = cafeSnap.data();
                        cardStoreName.innerText = cafeDataGlobal.name || cafeId.toUpperCase();

                        targetPoints = Number(cafeDataGlobal.rewardPoints) || 10;
                        const isGaming = cafeDataGlobal.category === 'gaming';
                        stampIcon = isGaming ? "🎮" : "☕";
                        rewardTitleText = cafeDataGlobal.rewardTitle || (isGaming ? 'ساعة لعب مجانية 🎮' : 'كوب قهوة مجاني ☕');

                        rewardHint.innerText = `${rewardTitleText} عند ${targetPoints} نقاط`;

                        if (cafeDataGlobal.logoUrl) {
                            cardLogo.src = cafeDataGlobal.logoUrl;
                            cardLogo.classList.remove('hidden');
                        }

                        const pColor = cafeDataGlobal.primaryColor || '#222222';
                        const sColor = cafeDataGlobal.secondaryColor || '#111111';
                        loyaltyCard.style.background = `linear-gradient(135deg, ${pColor}, ${sColor})`;
                    }
                }

                cardCustName.innerText = customerDataGlobal.name || 'عميل مميز';
                cardIdDisplay.innerText = cardId;
                updateStampsAndProgress(customerDataGlobal.points || 0);

                // تحديث فوري (Live) للأختام وشريط التقدم بمجرد أن يضيف الكاشير نقطة
                onSnapshot(custRef, (liveSnap) => {
                    if (liveSnap.exists()) {
                        const liveData = liveSnap.data();
                        const pts = liveData.points || 0;
                        customerDataGlobal.points = pts;
                        updateStampsAndProgress(pts);
                    }
                });

                loadingBox.classList.add('hidden');
                cardWrapper.classList.remove('hidden');

            } catch (error) {
                console.error("خطأ:", error);
                loadingText.innerText = "حدث خطأ أثناء تحميل البطاقة.";
            }
        }

        initCardPage();

        googleWalletBtn.addEventListener('click', async () => {
            if (!customerDataGlobal) return;
            googleWalletBtn.disabled = true;
            googleWalletBtn.innerText = "جاري تجهيز بطاقة Google Wallet... ⏳";

            try {
                const res = await fetch('https://cafe-loyalty-system-oow4.onrender.com/create-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardId: cardId,
                        customerName: customerDataGlobal.name,
                        points: customerDataGlobal.points || 0,
                        cafeId: cafeId,
                        cafeName: cafeDataGlobal.name || cafeId.toUpperCase(),
                        logoUrl: cafeDataGlobal.logoUrl || '',
                        primaryColor: cafeDataGlobal.primaryColor || '#111111'
                    })
                });

                const data = await res.json();
                if (data.saveUrl) {
                    window.location.href = data.saveUrl;
                } else {
                    alert("تعذر إنشاء رابط المحفظة، حاول مرة أخرى.");
                }
            } catch (err) {
                alert("تعذر الاتصال بالسيرفر، يرجى المحاولة بعد قليل.");
            } finally {
                googleWalletBtn.disabled = false;
                googleWalletBtn.innerText = "📲 إضافة البطاقة إلى Google Wallet";
            }
        });
    </script>
</body>
</html>
