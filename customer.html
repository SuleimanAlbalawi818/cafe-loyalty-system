<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة الولاء - SHABTEN CARD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        .loader-box {
            background: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .card-wrapper {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* تصميم البطاقة بتدرج محايد يتغير برمجياً حسب المتجر */
        .loyalty-card {
            background: linear-gradient(135deg, #222222, #111111);
            color: #fff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            text-align: right;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .store-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .store-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: #fff;
        }

        .store-name {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .brand-badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.18);
            padding: 4px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
        }

        .points-box {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 18px;
            backdrop-filter: blur(5px);
        }

        .points-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .points-value {
            font-size: 34px;
            font-weight: bold;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 12px;
        }

        .cust-label {
            font-size: 11px;
            opacity: 0.75;
        }

        .cust-val {
            font-weight: bold;
            font-size: 15px;
            margin-top: 2px;
        }

        .wallet-btn {
            width: 100%;
            padding: 15px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }

        .wallet-btn:hover {
            opacity: 0.9;
        }

        .wallet-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <!-- شاشة التحميل حتى لا يظهر أي شعار خاطئ -->
    <div id="loadingBox" class="loader-box">
        <div class="spinner"></div>
        <div id="loadingText">جاري تجهيز بطاقتك...</div>
    </div>

    <!-- البطاقة الفعلية -->
    <div id="cardWrapper" class="card-wrapper hidden">
        <div id="loyaltyCard" class="loyalty-card">
            <div class="card-header">
                <div class="store-info">
                    <img id="cardLogo" class="store-logo hidden" src="" alt="Logo">
                    <div>
                        <div id="cardStoreName" class="store-name">بطاقة الولاء</div>
                        <div id="rewardHint" style="font-size:11px; opacity:0.85;">مكافأة مجانية عند 10 نقاط</div>
                    </div>
                </div>
                <span class="brand-badge">SHABTEN CARD</span>
            </div>

            <div class="points-box">
                <div class="points-label">رصيد النقاط الحالي</div>
                <div id="cardPoints" class="points-value">0</div>
            </div>

            <div class="card-footer">
                <div>
                    <div class="cust-label">اسم حامل البطاقة</div>
                    <div id="cardCustName" class="cust-val">-</div>
                </div>
                <div style="text-align: left;">
                    <div class="cust-label">رقم البطاقة</div>
                    <div id="cardIdDisplay" class="cust-val" dir="ltr">-</div>
                </div>
            </div>
        </div>

        <button id="googleWalletBtn" class="wallet-btn">
            📲 إضافة البطاقة إلى Google Wallet
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6BpW0hlP6EUycPPkrk6pR-3Z0FRawWwc",
            authDomain: "cafe-system-24331.firebaseapp.com",
            projectId: "cafe-system-24331",
            storageBucket: "cafe-system-24331.firebasestorage.app",
            messagingSenderId: "845856227747",
            appId: "1:845856227747:web:378c6d02fc89410df41a16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cardId = (urlParams.get('id') || '').trim().toUpperCase();
        let cafeId = (urlParams.get('cafe') || '').trim().toLowerCase();

        const loadingBox = document.getElementById('loadingBox');
        const loadingText = document.getElementById('loadingText');
        const cardWrapper = document.getElementById('cardWrapper');
        const loyaltyCard = document.getElementById('loyaltyCard');
        const cardLogo = document.getElementById('cardLogo');
        const cardStoreName = document.getElementById('cardStoreName');
        const rewardHint = document.getElementById('rewardHint');
        const cardPoints = document.getElementById('cardPoints');
        const cardCustName = document.getElementById('cardCustName');
        const cardIdDisplay = document.getElementById('cardIdDisplay');
        const googleWalletBtn = document.getElementById('googleWalletBtn');

        let customerDataGlobal = null;
        let cafeDataGlobal = {};

        async function initCardPage() {
            if (!cardId) {
                loadingText.innerText = "❌ رقم البطاقة غير موجود في الرابط!";
                return;
            }

            try {
                // 1. جلب بيانات الزبون أولاً
                const custRef = doc(db, "customers", cardId);
                const custSnap = await getDoc(custRef);

                if (!custSnap.exists()) {
                    loadingText.innerText = "❌ لم يتم العثور على هذه البطاقة!";
                    return;
                }

                customerDataGlobal = custSnap.data();

                // إذا لم يكن كود المتجر موجوداً في الرابط، نأخذه من ملف الزبون نفسه
                if (!cafeId && customerDataGlobal.cafeId) {
                    cafeId = customerDataGlobal.cafeId.toLowerCase();
                }

                // 2. جلب هوية المتجر (الاسم، الشعار، الألوان) قبل إظهار البطاقة
                if (cafeId) {
                    const cafeSnap = await getDoc(doc(db, "cafes", cafeId));
                    if (cafeSnap.exists()) {
                        cafeDataGlobal = cafeSnap.data();
                        cardStoreName.innerText = cafeDataGlobal.name || cafeId.toUpperCase();

                        const reqPts = cafeDataGlobal.rewardPoints || 10;
                        const reqTitle = cafeDataGlobal.rewardTitle || (cafeDataGlobal.category === 'gaming' ? 'ساعة لعب مجانية 🎮' : 'كوب قهوة مجاني ☕');
                        rewardHint.innerText = `${reqTitle} عند ${reqPts} نقاط`;

                        if (cafeDataGlobal.logoUrl) {
                            cardLogo.src = cafeDataGlobal.logoUrl;
                            cardLogo.classList.remove('hidden');
                        }

                        const pColor = cafeDataGlobal.primaryColor || '#222222';
                        const sColor = cafeDataGlobal.secondaryColor || '#111111';
                        loyaltyCard.style.background = `linear-gradient(135deg, ${pColor}, ${sColor})`;
                    }
                }

                // 3. عرض بيانات الزبون وتفعيل التحديث اللحظي للنقاط
                cardCustName.innerText = customerDataGlobal.name || 'عميل مميز';
                cardIdDisplay.innerText = cardId;
                cardPoints.innerText = customerDataGlobal.points || 0;

                onSnapshot(custRef, (liveSnap) => {
                    if (liveSnap.exists()) {
                        const liveData = liveSnap.data();
                        cardPoints.innerText = liveData.points || 0;
                        customerDataGlobal.points = liveData.points || 0;
                    }
                });

                // إخفاء التحميل وإظهار البطاقة الجاهزة
                loadingBox.classList.add('hidden');
                cardWrapper.classList.remove('hidden');

            } catch (error) {
                console.error("خطأ:", error);
                loadingText.innerText = "حدث خطأ أثناء تحميل البطاقة.";
            }
        }

        initCardPage();

        // زر الإضافة إلى Google Wallet بنفس هوية المتجر
        googleWalletBtn.addEventListener('click', async () => {
            if (!customerDataGlobal) return;
            googleWalletBtn.disabled = true;
            googleWalletBtn.innerText = "جاري تجهيز بطاقة Google Wallet... ⏳";

            try {
                const res = await fetch('https://cafe-loyalty-system-oow4.onrender.com/create-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cardId: cardId,
                        customerName: customerDataGlobal.name,
                        points: customerDataGlobal.points || 0,
                        cafeId: cafeId,
                        cafeName: cafeDataGlobal.name || cafeId.toUpperCase(),
                        logoUrl: cafeDataGlobal.logoUrl || '',
                        primaryColor: cafeDataGlobal.primaryColor || '#111111'
                    })
                });

                const data = await res.json();
                if (data.saveUrl) {
                    window.location.href = data.saveUrl;
                } else {
                    alert("تعذر إنشاء رابط المحفظة، حاول مرة أخرى.");
                }
            } catch (err) {
                alert("تعذر الاتصال بالسيرفر، يرجى المحاولة بعد قليل.");
            } finally {
                googleWalletBtn.disabled = false;
                googleWalletBtn.innerText = "📲 إضافة البطاقة إلى Google Wallet";
            }
        });
    </script>
</body>

</html>
