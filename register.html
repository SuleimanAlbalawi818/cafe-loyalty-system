<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العملاء الذكية - SHABTEN CARD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-navy: #0f172a;
            --slate-800: #1e293b;
            --slate-600: #475569;
            --border-color: #e2e8f0;
            --gold: #d4af37;
            --emerald: #10b981;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body { 
            background: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 50%, #eef2f6 100%);
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 18px;
            color: var(--slate-800);
        }

        .register-container { 
            background: #ffffff;
            padding: 34px 28px;
            border-radius: 24px; 
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12), 0 4px 16px rgba(15, 23, 42, 0.04); 
            width: 100%;
            max-width: 420px;
            text-align: center; 
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .register-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--dark-navy), var(--gold), var(--emerald));
        }

        .hidden { display: none !important; }

        .loader-box {
            padding: 45px 10px;
            color: var(--slate-800);
            font-weight: 700;
            font-size: 15px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--dark-navy);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .logo { 
            width: 92px;
            height: 92px;
            border-radius: 50%; 
            border: 3px solid var(--dark-navy);
            object-fit: cover;
            background-color: #fff;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        }

        h1 {
            color: var(--dark-navy);
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 6px 0;
        }

        p {
            color: var(--slate-600);
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 18px 0;
            line-height: 1.6;
        }
        
        .welcome-bonus-banner {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            border: 1px solid #f59e0b;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 18px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 14px;
        }

        .mode-tab {
            flex: 1;
            padding: 11px 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--slate-600);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mode-tab.active {
            background: var(--dark-navy);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
        }

        .field-label {
            display: block;
            text-align: right;
            font-size: 13px;
            color: var(--slate-800);
            margin-bottom: 6px;
            font-weight: 700;
        }

        input { 
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 14px; 
            border: 1.5px solid #cbd5e1;
            border-radius: 12px; 
            background: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--dark-navy);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.06);
        }
        
        button { 
            width: 100%;
            padding: 14px;
            background: var(--dark-navy);
            color: white;
            border: none;
            border-radius: 12px; 
            font-size: 16px;
            font-weight: 800;
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; 
            margin-top: 6px;
            box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:disabled {
            background: #94a3b8 !important;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .brand-footer {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div id="loadingScreen" class="loader-box">
            <div class="spinner"></div>
            <div>جاري تحميل بوابة المتجر...</div>
        </div>

        <div id="mainContent" class="hidden">
            <div class="logo-wrapper">
                <img id="displayCafeLogo" class="logo hidden" src="" alt="شعار المتجر">
            </div>
            <h1 id="cafeTitle">برنامج الولاء</h1>
            <p id="cafeDesc">سجل معنا واجمع النقاط مع كل زيارة للحصول على مكافأتك المجانية ✨</p>

            <div id="welcomeBanner" class="welcome-bonus-banner hidden"></div>

            <div class="mode-tabs">
                <div id="tabNewUser" class="mode-tab active">✨ عميل جديد (أول مرة)</div>
                <div id="tabExistingUser" class="mode-tab">🔑 لدي بطاقة (دخول)</div>
            </div>

            <div id="newCustomerForm">
                <label for="custName" class="field-label">👤 الاسم الكريم:</label>
                <input type="text" id="custName" placeholder="أدخل اسمك الثنائي">

                <label for="custPhone" class="field-label">📱 رقم الهاتف:</label>
                <input type="tel" id="custPhone" placeholder="مثال: 079xxxxxxx">

                <label for="custBirthDate" class="field-label">🎂 تاريخ الميلاد (للحصول على هدية ميلادك):</label>
                <input type="date" id="custBirthDate">

                <button id="registerBtn">إصدار بطاقتي الرقمية الآن 🚀</button>
            </div>

            <div id="loginCustomerForm" class="hidden">
                <label for="loginIdentifier" class="field-label">🔍 أدخل رقم هاتفك أو رقم البطاقة:</label>
                <input type="text" id="loginIdentifier" placeholder="رقم الهاتف أو كود البطاقة (مثال: MAN-12)">
                <button id="loginCustBtn">فتح بطاقتي الحالية 🔓</button>
            </div>

            <div class="brand-footer">POWERED BY SHABTEN CARD</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA6BpW0hlP6EUycPPkrk6pR-3Z0FRawWwc",
          authDomain: "cafe-system-24331.firebaseapp.com",
          projectId: "cafe-system-24331",
          storageBucket: "cafe-system-24331.firebasestorage.app",
          messagingSenderId: "845856227747",
          appId: "1:845856227747:web:378c6d02fc89410df41a16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cafeId = (urlParams.get('cafe') || '').toLowerCase().trim();

        const loadingScreen = document.getElementById('loadingScreen');
        const mainContent = document.getElementById('mainContent');
        const registerBtn = document.getElementById('registerBtn');
        const loginCustBtn = document.getElementById('loginCustBtn');
        const logoEl = document.getElementById('displayCafeLogo');
        const titleEl = document.getElementById('cafeTitle');
        const descEl = document.getElementById('cafeDesc');
        const welcomeBanner = document.getElementById('welcomeBanner');

        const tabNewUser = document.getElementById('tabNewUser');
        const tabExistingUser = document.getElementById('tabExistingUser');
        const newCustomerForm = document.getElementById('newCustomerForm');
        const loginCustomerForm = document.getElementById('loginCustomerForm');

        let storeWelcomePoints = 0;

        tabNewUser.addEventListener('click', () => {
            tabNewUser.classList.add('active');
            tabExistingUser.classList.remove('active');
            newCustomerForm.classList.remove('hidden');
            loginCustomerForm.classList.add('hidden');
        });

        tabExistingUser.addEventListener('click', () => {
            tabExistingUser.classList.add('active');
            tabNewUser.classList.remove('active');
            loginCustomerForm.classList.remove('hidden');
            newCustomerForm.classList.add('hidden');
        });

        const fetchCafeData = async () => {
            if (!cafeId) {
                loadingScreen.innerHTML = "❌ الرابط غير مكتمل! يرجى مسح رمز الـ QR الخاص بالمتجر.";
                return;
            }

            try {
                const cafeRef = doc(db, "cafes", cafeId);
                const cafeSnap = await getDoc(cafeRef);
                
                if (cafeSnap.exists()) {
                    const cafeData = cafeSnap.data();

                    if (cafeData.isActive === false) {
                        loadingScreen.innerHTML = "⏸️ نظام الولاء لهذا المتجر متوقف مؤقتاً للتحديث. يرجى مراجعة إدارة المتجر.";
                        return;
                    }

                    titleEl.innerText = `برنامج ولاء ${cafeData.name}`;
                    
                    let reqPts = cafeData.rewardPoints || 10;
                    let reqTitle = cafeData.rewardTitle || (cafeData.category === 'gaming' ? 'ساعتك المجانية 🎮' : 'قهوتك المجانية ☕');
                    if (Array.isArray(cafeData.rewards) && cafeData.rewards.length > 0) {
                        reqPts = cafeData.rewards[0].points;
                        reqTitle = cafeData.rewards[0].title;
                    }
                    descEl.innerText = `اجمع النقاط في كل زيارة واحصل على ${reqTitle} عند ${reqPts} نقاط!`;

                    storeWelcomePoints = Number(cafeData.welcomePoints) || 0;
                    if (storeWelcomePoints > 0) {
                        welcomeBanner.innerText = `🎁 هدية ترحيبية: سجل الآن واحصل على (${storeWelcomePoints}) نقاط مجانية في بطاقتك فوراً!`;
                        welcomeBanner.classList.remove('hidden');
                    }

                    if (cafeData.logoUrl) {
                        logoEl.src = cafeData.logoUrl;
                        logoEl.classList.remove('hidden');
                    }

                    if (cafeData.primaryColor) {
                        registerBtn.style.backgroundColor = cafeData.primaryColor;
                        loginCustBtn.style.backgroundColor = cafeData.primaryColor;
                        logoEl.style.borderColor = cafeData.primaryColor;
                    }

                    loadingScreen.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                } else {
                    loadingScreen.innerHTML = "❌ لم يتم العثور على هذا المتجر في النظام.";
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات المتجر:", error);
                loadingScreen.innerHTML = "حدث خطأ أثناء تحميل الصفحة، يرجى المحاولة مرة أخرى.";
            }
        };

        fetchCafeData();

        async function findExistingCustomerInStoreFast(phoneOrId) {
            const cleanInput = phoneOrId.trim().toUpperCase();
            const cleanPhone = phoneOrId.replace(/\s+/g, '');

            if (cleanInput.includes('-')) {
                const directSnap = await getDoc(doc(db, "customers", cleanInput));
                if (directSnap.exists() && (directSnap.data().cafeId || '').toLowerCase() === cafeId) {
                    return cleanInput;
                }
            }

            const q = query(collection(db, "customers"), where("cafeId", "==", cafeId));
            const snap = await getDocs(q);
            let matchedId = null;

            snap.forEach((docSnap) => {
                const data = docSnap.data();
                const custPhone = (data.phone || '').replace(/\s+/g, '');
                if (custPhone === cleanPhone && cleanPhone !== '') {
                    matchedId = docSnap.id;
                }
            });

            return matchedId;
        }

        async function generateShortCardIdFast(cafeCode) {
            const prefix = cafeCode.substring(0, 3).toUpperCase();
            for (let attempt = 0; attempt < 10; attempt++) {
                const randomNum = attempt < 5 
                    ? Math.floor(10 + Math.random() * 90)
                    : Math.floor(100 + Math.random() * 900);
                
                const candidateId = `${prefix}-${randomNum}`;
                const checkSnap = await getDoc(doc(db, "customers", candidateId));
                
                if (!checkSnap.exists()) {
                    return candidateId;
                }
            }
            return `${prefix}-${Date.now().toString().slice(-3)}`;
        }

        registerBtn.addEventListener('click', async () => {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const birthDate = document.getElementById('custBirthDate').value;

            if (!name || !phone || !birthDate) {
                return alert("الرجاء إدخال الاسم، رقم الهاتف، وتاريخ الميلاد بالكامل");
            }

            registerBtn.disabled = true;
            registerBtn.innerText = "جاري إصدار البطاقة... ⚡";

            try {
                const existingCardId = await findExistingCustomerInStoreFast(phone);
                if (existingCardId) {
                    alert("أهلاً بك مجدداً! رقم هاتفك مسجل لدينا مسبقاً، سيتم فتح بطاقتك الحالية الآن 🎉");
                    window.location.href = `customer.html?cafe=${cafeId}&id=${existingCardId}`;
                    return;
                }

                const newCardId = await generateShortCardIdFast(cafeId);
                const initialPoints = storeWelcomePoints > 0 ? storeWelcomePoints : 0;

                const savePromises = [
                    setDoc(doc(db, "customers", newCardId), {
                        name: name,
                        phone: phone,
                        birthDate: birthDate,
                        points: initialPoints,
                        cafeId: cafeId,
                        createdAt: new Date()
                    })
                ];

                if (initialPoints > 0) {
                    savePromises.push(
                        addDoc(collection(db, "logs"), {
                            cafeId: cafeId,
                            customerId: newCardId,
                            customerName: name,
                            actionType: 'add',
                            pointsChange: `+${initialPoints} (ترحيب)`,
                            newBalance: initialPoints,
                            performedBy: '🎁 هدية تسجيل تلقائية',
                            timestamp: Date.now()
                        })
                    );
                }

                await Promise.all(savePromises);
                window.location.href = `customer.html?cafe=${cafeId}&id=${newCardId}`;
                
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء التسجيل. حاول مرة أخرى.");
                registerBtn.disabled = false;
                registerBtn.innerText = "إصدار بطاقتي الرقمية الآن 🚀";
            }
        });

        loginCustBtn.addEventListener('click', async () => {
            const identifier = document.getElementById('loginIdentifier').value.trim();
            if (!identifier) {
                return alert("الرجاء إدخال رقم هاتفك أو رقم البطاقة!");
            }

            loginCustBtn.disabled = true;
            loginCustBtn.innerText = "جاري الفتح... ⚡";

            try {
                const foundCardId = await findExistingCustomerInStoreFast(identifier);
                if (foundCardId) {
                    window.location.href = `customer.html?cafe=${cafeId}&id=${foundCardId}`;
                } else {
                    alert("❌ لم نجد بطاقة مسجلة بهذا الرقم في هذا المتجر. يمكنك التسجيل كعميل جديد من التبويب الأول!");
                }
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء البحث عن البطاقة.");
            } finally {
                loginCustBtn.disabled = false;
                loginCustBtn.innerText = "فتح بطاقتي الحالية 🔓";
            }
        });
    </script>
</body>
</html>
