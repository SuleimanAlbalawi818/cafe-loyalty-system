<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إصدار بطاقة ولاء - SHABTEN CARD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* شاشة التحميل المحايدة */
        .loader-box {
            padding: 40px 10px;
            color: #444;
            font-weight: bold;
            font-size: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ddd;
            margin-bottom: 10px;
            object-fit: cover;
            background-color: #fff;
        }

        h1 {
            color: #111;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .field-label {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #888 !important;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="register-container">
        <!-- شاشة انتظار سريعة ريثما يتم جلب بيانات المتجر -->
        <div id="loadingScreen" class="loader-box">
            <div class="spinner"></div>
            <div>جاري تحميل بيانات المتجر...</div>
        </div>

        <!-- محتوى التسجيل يظهر فقط بعد جلب شعار وألوان المتجر -->
        <div id="mainContent" class="hidden">
            <img id="displayCafeLogo" class="logo hidden" src="" alt="شعار المتجر">
            <h1 id="cafeTitle">انضم لبرنامج الولاء</h1>
            <p id="cafeDesc">سجل معنا واجمع النقاط مع كل زيارة للحصول على مكافأتك المجانية ✨</p>

            <input type="text" id="custName" placeholder="الاسم الكريم">
            <input type="tel" id="custPhone" placeholder="رقم الهاتف">

            <label for="custBirthDate" class="field-label">تاريخ الميلاد (اليوم / الشهر / السنة) للحصول على هدية ميلادك
                🎂:</label>
            <input type="date" id="custBirthDate">

            <button id="registerBtn">إصدار بطاقتي الآن</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6BpW0hlP6EUycPPkrk6pR-3Z0FRawWwc",
            authDomain: "cafe-system-24331.firebaseapp.com",
            projectId: "cafe-system-24331",
            storageBucket: "cafe-system-24331.firebasestorage.app",
            messagingSenderId: "845856227747",
            appId: "1:845856227747:web:378c6d02fc89410df41a16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cafeId = (urlParams.get('cafe') || '').toLowerCase().trim();

        const loadingScreen = document.getElementById('loadingScreen');
        const mainContent = document.getElementById('mainContent');
        const registerBtn = document.getElementById('registerBtn');
        const logoEl = document.getElementById('displayCafeLogo');
        const titleEl = document.getElementById('cafeTitle');
        const descEl = document.getElementById('cafeDesc');

        const fetchCafeData = async () => {
            if (!cafeId) {
                loadingScreen.innerHTML = "❌ الرابط غير مكتمل! يرجى مسح رمز الـ QR الخاص بالمتجر.";
                return;
            }

            try {
                const cafeRef = doc(db, "cafes", cafeId);
                const cafeSnap = await getDoc(cafeRef);

                if (cafeSnap.exists()) {
                    const cafeData = cafeSnap.data();
                    titleEl.innerText = `انضم لبرنامج ولاء ${cafeData.name}`;

                    const reqPts = cafeData.rewardPoints || 10;
                    const reqTitle = cafeData.rewardTitle || (cafeData.category === 'gaming' ? 'ساعتك المجانية 🎮' : 'قهوتك المجانية ☕');
                    descEl.innerText = `سجل معنا واجمع النقاط في كل زيارة. احصل على ${reqTitle} بعد ${reqPts} نقاط!`;

                    if (cafeData.logoUrl) {
                        logoEl.src = cafeData.logoUrl;
                        logoEl.classList.remove('hidden');
                    }

                    if (cafeData.primaryColor) {
                        registerBtn.style.backgroundColor = cafeData.primaryColor;
                        logoEl.style.borderColor = cafeData.primaryColor;
                    }

                    // إخفاء شاشة التحميل وإظهار الفورم بهوية المتجر الصحيحة
                    loadingScreen.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                } else {
                    loadingScreen.innerHTML = "❌ لم يتم العثور على هذا المتجر في النظام.";
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات المتجر:", error);
                loadingScreen.innerHTML = "حدث خطأ أثناء تحميل الصفحة، يرجى المحاولة مرة أخرى.";
            }
        };

        fetchCafeData();

        async function generateShortCardId(cafeCode) {
            const prefix = cafeCode.substring(0, 3).toUpperCase();
            for (let attempt = 0; attempt < 20; attempt++) {
                const randomNum = attempt < 15
                    ? Math.floor(10 + Math.random() * 90)
                    : Math.floor(100 + Math.random() * 900);

                const candidateId = `${prefix}-${randomNum}`;
                const checkRef = doc(db, "customers", candidateId);
                const checkSnap = await getDoc(checkRef);

                if (!checkSnap.exists()) {
                    return candidateId;
                }
            }
            return `${prefix}-${Date.now().toString().slice(-3)}`;
        }

        registerBtn.addEventListener('click', async () => {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const birthDate = document.getElementById('custBirthDate').value;

            if (!name || !phone || !birthDate) {
                return alert("الرجاء إدخال الاسم، رقم الهاتف، وتاريخ الميلاد بالكامل");
            }

            registerBtn.disabled = true;
            registerBtn.innerText = "جاري إنشاء بطاقتك...";

            try {
                const newCardId = await generateShortCardId(cafeId);

                const newDocRef = doc(db, "customers", newCardId);
                await setDoc(newDocRef, {
                    name: name,
                    phone: phone,
                    birthDate: birthDate,
                    points: 0,
                    cafeId: cafeId,
                    createdAt: new Date()
                });

                window.location.href = `customer.html?cafe=${cafeId}&id=${newCardId}`;

            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء التسجيل. حاول مرة أخرى.");
                registerBtn.disabled = false;
                registerBtn.innerText = "إصدار بطاقتي الآن";
            }
        });
    </script>
</body>

</html>
