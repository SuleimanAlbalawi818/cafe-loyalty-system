<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العملاء - SHABTEN CARD</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f5; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box;
        }
        .register-container { 
            background: #fff; padding: 28px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; max-width: 400px; text-align: center; 
            box-sizing: border-box;
        }
        .hidden { display: none !important; }

        .loader-box {
            padding: 40px 10px;
            color: #444;
            font-weight: bold;
            font-size: 15px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #ddd;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .logo { 
            width: 85px; height: 85px; border-radius: 50%; 
            border: 3px solid #ddd; margin-bottom: 10px; 
            object-fit: cover;
            background-color: #fff;
        }
        h1 { color: #111; font-size: 20px; margin-top: 0; margin-bottom: 6px; }
        p { color: #666; font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
        
        /* تبويبات التبديل بين زبون جديد وزبون مسجل */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 5px;
            border-radius: 10px;
        }
        .mode-tab {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-tab.active {
            background: #fff;
            color: #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .field-label {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input { 
            width: 100%; padding: 13px; margin-bottom: 14px; 
            border: 1px solid #ccc; border-radius: 8px; 
            box-sizing: border-box; font-family: inherit; font-size: 15px;
        }
        input:focus { outline: none; border-color: #555; }
        
        button { 
            width: 100%; padding: 14px; background: #111;
            color: white; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            transition: opacity 0.3s; 
            margin-top: 5px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #888 !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="register-container">
        <!-- شاشة انتظار سريعة ريثما يتم جلب بيانات المتجر -->
        <div id="loadingScreen" class="loader-box">
            <div class="spinner"></div>
            <div>جاري تحميل بيانات المتجر...</div>
        </div>

        <!-- محتوى الصفحة يظهر بعد جلب هوية المتجر -->
        <div id="mainContent" class="hidden">
            <img id="displayCafeLogo" class="logo hidden" src="" alt="شعار المتجر">
            <h1 id="cafeTitle">برنامج الولاء</h1>
            <p id="cafeDesc">سجل معنا واجمع النقاط مع كل زيارة للحصول على مكافأتك المجانية ✨</p>

            <!-- شريط التبديل: تسجيل جديد أو دخول لبطاقة سابقة -->
            <div class="mode-tabs">
                <div id="tabNewUser" class="mode-tab active">✨ عميل جديد (أول مرة)</div>
                <div id="tabExistingUser" class="mode-tab">🔑 لدي بطاقة (دخول)</div>
            </div>

            <!-- القسم الأول: فورم تسجيل زبون جديد -->
            <div id="newCustomerForm">
                <input type="text" id="custName" placeholder="الاسم الكريم">
                <input type="tel" id="custPhone" placeholder="رقم الهاتف (مثال: 079xxxxxxx)">

                <label for="custBirthDate" class="field-label">تاريخ الميلاد للحصول على هدية ميلادك 🎂:</label>
                <input type="date" id="custBirthDate">

                <button id="registerBtn">إصدار بطاقتي الآن</button>
            </div>

            <!-- القسم الثاني: فورم تسجيل الدخول لزبون مسجل مسبقاً -->
            <div id="loginCustomerForm" class="hidden">
                <label for="loginIdentifier" class="field-label">أدخل رقم هاتفك أو رقم البطاقة:</label>
                <input type="text" id="loginIdentifier" placeholder="رقم الهاتف أو كود البطاقة (مثال: MAN-12)">
                <button id="loginCustBtn">فتح بطاقتي الحالية 🔓</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA6BpW0hlP6EUycPPkrk6pR-3Z0FRawWwc",
          authDomain: "cafe-system-24331.firebaseapp.com",
          projectId: "cafe-system-24331",
          storageBucket: "cafe-system-24331.firebasestorage.app",
          messagingSenderId: "845856227747",
          appId: "1:845856227747:web:378c6d02fc89410df41a16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cafeId = (urlParams.get('cafe') || '').toLowerCase().trim();

        const loadingScreen = document.getElementById('loadingScreen');
        const mainContent = document.getElementById('mainContent');
        const registerBtn = document.getElementById('registerBtn');
        const loginCustBtn = document.getElementById('loginCustBtn');
        const logoEl = document.getElementById('displayCafeLogo');
        const titleEl = document.getElementById('cafeTitle');
        const descEl = document.getElementById('cafeDesc');

        const tabNewUser = document.getElementById('tabNewUser');
        const tabExistingUser = document.getElementById('tabExistingUser');
        const newCustomerForm = document.getElementById('newCustomerForm');
        const loginCustomerForm = document.getElementById('loginCustomerForm');

        // التبديل بين تبويب "عميل جديد" وتبويب "لدي بطاقة"
        tabNewUser.addEventListener('click', () => {
            tabNewUser.classList.add('active');
            tabExistingUser.classList.remove('active');
            newCustomerForm.classList.remove('hidden');
            loginCustomerForm.classList.add('hidden');
        });

        tabExistingUser.addEventListener('click', () => {
            tabExistingUser.classList.add('active');
            tabNewUser.classList.remove('active');
            loginCustomerForm.classList.remove('hidden');
            newCustomerForm.classList.add('hidden');
        });

        const fetchCafeData = async () => {
            if (!cafeId) {
                loadingScreen.innerHTML = "❌ الرابط غير مكتمل! يرجى مسح رمز الـ QR الخاص بالمتجر.";
                return;
            }

            try {
                const cafeRef = doc(db, "cafes", cafeId);
                const cafeSnap = await getDoc(cafeRef);
                
                if (cafeSnap.exists()) {
                    const cafeData = cafeSnap.data();
                    titleEl.innerText = `برنامج ولاء ${cafeData.name}`;
                    
                    // قراءة أول جائزة لعرضها في الوصف التشويقي
                    let reqPts = cafeData.rewardPoints || 10;
                    let reqTitle = cafeData.rewardTitle || (cafeData.category === 'gaming' ? 'ساعتك المجانية 🎮' : 'قهوتك المجانية ☕');
                    if (Array.isArray(cafeData.rewards) && cafeData.rewards.length > 0) {
                        reqPts = cafeData.rewards[0].points;
                        reqTitle = cafeData.rewards[0].title;
                    }
                    descEl.innerText = `اجمع النقاط في كل زيارة واحصل على ${reqTitle} عند ${reqPts} نقاط!`;

                    if (cafeData.logoUrl) {
                        logoEl.src = cafeData.logoUrl;
                        logoEl.classList.remove('hidden');
                    }

                    if (cafeData.primaryColor) {
                        registerBtn.style.backgroundColor = cafeData.primaryColor;
                        loginCustBtn.style.backgroundColor = cafeData.primaryColor;
                        logoEl.style.borderColor = cafeData.primaryColor;
                    }

                    loadingScreen.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                } else {
                    loadingScreen.innerHTML = "❌ لم يتم العثور على هذا المتجر في النظام.";
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات المتجر:", error);
                loadingScreen.innerHTML = "حدث خطأ أثناء تحميل الصفحة، يرجى المحاولة مرة أخرى.";
            }
        };

        fetchCafeData();

        // دالة للبحث عن زبون مسجل مسبقاً في نفس المتجر (برقم الهاتف أو رقم البطاقة)
        async function findExistingCustomerInStore(phoneOrId) {
            const cleanInput = phoneOrId.trim().toUpperCase();
            const cleanPhone = phoneOrId.replace(/\s+/g, '');

            // 1. فحص إذا كان المدخل هو رقم البطاقة مباشرة (مثل MAN-12)
            const directRef = doc(db, "customers", cleanInput);
            const directSnap = await getDoc(directRef);
            if (directSnap.exists()) {
                const data = directSnap.data();
                if ((data.cafeId || '').toLowerCase() === cafeId) {
                    return cleanInput;
                }
            }

            // 2. البحث برقم الهاتف داخل نفس المتجر
            const snap = await getDocs(collection(db, "customers"));
            let matchedId = null;
            snap.forEach((docSnap) => {
                const data = docSnap.data();
                const custCafe = (data.cafeId || '').toLowerCase();
                const custPhone = (data.phone || '').replace(/\s+/g, '');
                if (custCafe === cafeId && custPhone === cleanPhone && cleanPhone !== '') {
                    matchedId = docSnap.id;
                }
            });

            return matchedId;
        }

        async function generateShortCardId(cafeCode) {
            const prefix = cafeCode.substring(0, 3).toUpperCase();
            for (let attempt = 0; attempt < 20; attempt++) {
                const randomNum = attempt < 15 
                    ? Math.floor(10 + Math.random() * 90)
                    : Math.floor(100 + Math.random() * 900);
                
                const candidateId = `${prefix}-${randomNum}`;
                const checkRef = doc(db, "customers", candidateId);
                const checkSnap = await getDoc(checkRef);
                
                if (!checkSnap.exists()) {
                    return candidateId;
                }
            }
            return `${prefix}-${Date.now().toString().slice(-3)}`;
        }

        // 1. زر تسجيل زبون جديد (مع فحص تلقائي إذا كان رقم هاتفه مسجلاً مسبقاً)
        registerBtn.addEventListener('click', async () => {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const birthDate = document.getElementById('custBirthDate').value;

            if (!name || !phone || !birthDate) {
                return alert("الرجاء إدخال الاسم، رقم الهاتف، وتاريخ الميلاد بالكامل");
            }

            registerBtn.disabled = true;
            registerBtn.innerText = "جاري التحقق وإنشاء البطاقة...";

            try {
                // إذا كان رقم الهاتف مسجلاً مسبقاً في نفس المتجر، نفتحه له مباشرة بدون تكرار
                const existingCardId = await findExistingCustomerInStore(phone);
                if (existingCardId) {
                    alert("أهلاً بك مجدداً! رقم هاتفك مسجل لدينا مسبقاً، سيتم فتح بطاقتك الحالية الآن 🎉");
                    window.location.href = `customer.html?cafe=${cafeId}&id=${existingCardId}`;
                    return;
                }

                const newCardId = await generateShortCardId(cafeId);

                const newDocRef = doc(db, "customers", newCardId);
                await setDoc(newDocRef, {
                    name: name,
                    phone: phone,
                    birthDate: birthDate,
                    points: 0,
                    cafeId: cafeId,
                    createdAt: new Date()
                });

                window.location.href = `customer.html?cafe=${cafeId}&id=${newCardId}`;
                
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء التسجيل. حاول مرة أخرى.");
                registerBtn.disabled = false;
                registerBtn.innerText = "إصدار بطاقتي الآن";
            }
        });

        // 2. زر تسجيل الدخول للزبون المسجل مسبقاً
        loginCustBtn.addEventListener('click', async () => {
            const identifier = document.getElementById('loginIdentifier').value.trim();
            if (!identifier) {
                return alert("الرجاء إدخال رقم هاتفك أو رقم البطاقة!");
            }

            loginCustBtn.disabled = true;
            loginCustBtn.innerText = "جاري البحث عن بطاقتك... ⏳";

            try {
                const foundCardId = await findExistingCustomerInStore(identifier);
                if (foundCardId) {
                    window.location.href = `customer.html?cafe=${cafeId}&id=${foundCardId}`;
                } else {
                    alert("❌ لم نجد بطاقة مسجلة بهذا الرقم في هذا المتجر. يمكنك التسجيل كعميل جديد من التبويب الأول!");
                }
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء البحث عن البطاقة.");
            } finally {
                loginCustBtn.disabled = false;
                loginCustBtn.innerText = "فتح بطاقتي الحالية 🔓";
            }
        });
    </script>
</body>
</html>
