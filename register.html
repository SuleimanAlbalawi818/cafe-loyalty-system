<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إصدار بطاقة ولاء</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f5; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        .register-container { 
            background: #fff; padding: 30px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 90%; max-width: 400px; text-align: center; 
        }
        .logo { 
            width: 90px; height: 90px; border-radius: 50%; 
            border: 3px solid #ddd; margin-bottom: 10px; 
            object-fit: cover;
            background-color: #fff;
        }
        h1 { color: #111; font-size: 20px; margin-top: 0; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 22px; line-height: 1.5; }
        
        .field-label {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #444;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; 
            border: 1px solid #ccc; border-radius: 8px; 
            box-sizing: border-box; font-family: inherit; font-size: 15px;
        }
        input:focus { outline: none; border-color: #555; }
        
        button { 
            width: 100%; padding: 15px; background: #1e7041;
            color: white; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            transition: opacity 0.3s; 
            margin-top: 5px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #888 !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="register-container">
        <img id="displayCafeLogo" class="logo" src="Mandel.jpg" alt="شعار الكافيه">
        <h1 id="cafeTitle">انضم لبرنامج الولاء</h1>
        <p>سجل معنا واجمع النقاط مع كل كوب قهوة. احصل على قهوتك المجانية بعد 10 نقاط ☕</p>

        <input type="text" id="custName" placeholder="الاسم الكريم">
        <input type="tel" id="custPhone" placeholder="رقم الهاتف">

        <label for="custBirthDate" class="field-label">تاريخ الميلاد (اليوم / الشهر / السنة) للحصول على هدية ميلادك 🎂:</label>
        <input type="date" id="custBirthDate">

        <button id="registerBtn">إصدار بطاقتي الآن</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA6BpW0hlP6EUycPPkrk6pR-3Z0FRawWwc",
          authDomain: "cafe-system-24331.firebaseapp.com",
          projectId: "cafe-system-24331",
          storageBucket: "cafe-system-24331.firebasestorage.app",
          messagingSenderId: "845856227747",
          appId: "1:845856227747:web:378c6d02fc89410df41a16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const cafeId = (urlParams.get('cafe') || 'mandel').toLowerCase();

        const registerBtn = document.getElementById('registerBtn');
        const logoEl = document.getElementById('displayCafeLogo');
        const titleEl = document.getElementById('cafeTitle');

        // شعارات افتراضية فورية حسب الرابط
        if (cafeId === 'solaf') {
            logoEl.src = 'solaf.jpg';
        }

        // جلب بيانات الكافيه لتلوين الصفحة
        const fetchCafeData = async () => {
            try {
                const cafeRef = doc(db, "cafes", cafeId);
                const cafeSnap = await getDoc(cafeRef);
                
                if (cafeSnap.exists()) {
                    const cafeData = cafeSnap.data();
                    
                    titleEl.innerText = `انضم لبرنامج ولاء ${cafeData.name}`;
                    
                    if (cafeData.logoUrl && cafeData.logoUrl !== "logo.jpg") {
                        logoEl.src = cafeData.logoUrl;
                    }

                    if (cafeData.primaryColor) {
                        registerBtn.style.backgroundColor = cafeData.primaryColor;
                        logoEl.style.borderColor = cafeData.primaryColor;
                    }
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات الكافيه:", error);
            }
        };

        fetchCafeData();

        // عملية التسجيل
        registerBtn.addEventListener('click', async () => {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const birthDate = document.getElementById('custBirthDate').value; // بصيغة YYYY-MM-DD (السنة-الشهر-اليوم)

            if (!name || !phone || !birthDate) {
                return alert("الرجاء إدخال الاسم، رقم الهاتف، وتاريخ الميلاد بالكامل");
            }

            registerBtn.disabled = true;
            registerBtn.innerText = "جاري إنشاء بطاقتك...";

            const randomStr = Math.random().toString(36).substring(2, 5).toUpperCase();
            const phoneSuffix = phone.slice(-4);
            const newCardId = `CAF-${phoneSuffix}${randomStr}`;

            try {
                const newDocRef = doc(db, "customers", newCardId);
                await setDoc(newDocRef, {
                    name: name,
                    phone: phone,
                    birthDate: birthDate, // حفظ اليوم والشهر والسنة (مثال: 1999-05-14)
                    points: 0,
                    cafeId: cafeId,
                    createdAt: new Date()
                });

                window.location.href = `customer.html?cafe=${cafeId}&id=${newCardId}`;
                
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء التسجيل. حاول مرة أخرى.");
                registerBtn.disabled = false;
                registerBtn.innerText = "إصدار بطاقتي الآن";
            }
        });
    </script>
</body>
</html>
